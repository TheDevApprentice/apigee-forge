[package]
name = "apigee-forge-core"
version.workspace = true
edition.workspace = true

[lib]
name = "apigee_forge_core"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1.89"
getrandom = "=0.3.4"
gcp_auth = "0.12.7"
keyring = "=3.6.3"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled-sqlcipher"] }
oauth2 = "=5.0.0"
openapiv3 = "2.2.0"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tera = { version = "=1.20.1", default-features = false }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"
webbrowser = "=1.2.1"
zip = { version = "=7.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
quick-xml = "=0.41.0"
wiremock = "=0.6.4"
