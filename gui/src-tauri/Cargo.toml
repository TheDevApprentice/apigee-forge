[package]
name = "gui"
version.workspace = true
edition.workspace = true

[lib]
name = "gui_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.3.0", features = [] }

[dependencies]
async-trait = "=0.1.91"
apigee-forge-core = { package = "apigee-forge-core", path = "../../core" }
dotenvy = "=0.15.7"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.6.0", features = [] }
url = "=2.5.8"

[dev-dependencies]
serde_json = "1.0.151"
